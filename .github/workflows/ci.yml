name: CI ML Churn

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.14"

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        run: |
          pytest